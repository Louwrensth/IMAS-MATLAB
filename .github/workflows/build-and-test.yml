name: Build and Test

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  CMAKE_VERSION: '3.27.6'
  BOOST_VERSION: '1.83.0'
  HDF5_VERSION: '1.14.3'
  PYTHON_VERSION: '3.11'

jobs:
  build-linux:
    name: Build on Linux (GCC)
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-20.04]
        include:
          - os: ubuntu-22.04
            name: "GCC 13 (Ubuntu 22.04)"
            cc: gcc-13
            cxx: g++-13
            backend_mdsplus: OFF
            backend_uda: OFF
          - os: ubuntu-24.04
            name: "GCC 13 (Ubuntu 24.04)"
            cc: gcc-13
            cxx: g++-13
            backend_mdsplus: OFF
            backend_uda: OFF
          - os: ubuntu-20.04
            name: "GCC 11 (Ubuntu 20.04)"
            cc: gcc-11
            cxx: g++-11
            backend_mdsplus: OFF
            backend_uda: OFF
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Set up MATLAB
      uses: matlab-actions/setup-matlab@v2
      with:
        release: R2023b
        products: MATLAB
    
    - name: Verify MATLAB installation
      run: |
        which matlab || echo "MATLAB not in PATH"
        matlab -batch "version" || echo "MATLAB batch mode failed"
        echo "MATLAB_ROOT=$(dirname $(dirname $(which matlab)))" >> $GITHUB_ENV
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/boost
          ~/hdf5
          ~/saxon
          ~/.matlab
        key: ${{ runner.os }}-deps-${{ env.BOOST_VERSION }}-${{ env.HDF5_VERSION }}-matlab-R2023b-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-deps-${{ env.BOOST_VERSION }}-${{ env.HDF5_VERSION }}-matlab-R2023b-
          ${{ runner.os }}-deps-${{ env.BOOST_VERSION }}-${{ env.HDF5_VERSION }}-
          ${{ runner.os }}-deps-
    
    - name: Install system dependencies
      run: |
        # Detect package manager and install dependencies
        if command -v apt-get &> /dev/null; then
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libxml2-dev \
            xsltproc \
            default-jdk \
            wget \
            ${{ matrix.cxx }} \
            ${{ matrix.cc }}
        elif command -v dnf &> /dev/null; then
          sudo dnf install -y \
            gcc gcc-c++ \
            cmake \
            pkgconfig \
            libxml2-devel \
            libxslt \
            java-latest-openjdk \
            wget \
            make
        elif command -v yum &> /dev/null; then
          sudo yum install -y \
            gcc gcc-c++ \
            cmake \
            pkgconfig \
            libxml2-devel \
            libxslt \
            java-latest-openjdk \
            wget \
            make
        else
          echo "Unsupported package manager"
          exit 1
        fi
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sphinx sphinx-rtd-theme myst-parser sphinx-design
    
    - name: Download and install Boost
      run: |
        if [ ! -d "$HOME/boost" ]; then
          cd $HOME
          BOOST_VERSION_UNDERSCORE=$(echo $BOOST_VERSION | tr '.' '_')
          wget -q https://boostorg.jfrog.io/artifactory/main/release/${BOOST_VERSION}/source/boost_${BOOST_VERSION_UNDERSCORE}.tar.gz
          tar xzf boost_${BOOST_VERSION_UNDERSCORE}.tar.gz
          cd boost_${BOOST_VERSION_UNDERSCORE}
          ./bootstrap.sh --prefix=$HOME/boost --with-libraries=system,filesystem,log,thread
          ./b2 install -j$(nproc) > /dev/null
        fi
        echo "BOOST_ROOT=$HOME/boost" >> $GITHUB_ENV
        echo "$HOME/boost/lib" >> $GITHUB_PATH
    
    - name: Download and install HDF5
      run: |
        if [ ! -d "$HOME/hdf5" ]; then
          cd $HOME
          HDF5_VERSION_SHORT=$(echo $HDF5_VERSION | cut -d. -f1,2)
          wget -q https://support.hdfgroup.org/ftp/HDF5/releases/hdf5-${HDF5_VERSION_SHORT}/hdf5-${HDF5_VERSION}/src/hdf5-${HDF5_VERSION}.tar.gz
          tar xzf hdf5-${HDF5_VERSION}.tar.gz
          cd hdf5-${HDF5_VERSION}
          ./configure --prefix=$HOME/hdf5 --enable-cxx > /dev/null
          make -j$(nproc) > /dev/null
          make install > /dev/null
        fi
        echo "HDF5_ROOT=$HOME/hdf5" >> $GITHUB_ENV
        echo "$HOME/hdf5/bin" >> $GITHUB_PATH
        echo "LD_LIBRARY_PATH=$HOME/hdf5/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
    
    - name: Download and install Saxon-HE
      run: |
        if [ ! -d "$HOME/saxon" ]; then
          mkdir -p $HOME/saxon
          cd $HOME/saxon
          wget -q https://github.com/Saxonica/Saxon-HE/releases/download/SaxonHE12-4/SaxonHE12-4J.zip
          unzip -q SaxonHE12-4J.zip
        fi
        echo "SAXON_JAR=$HOME/saxon/saxon-he-12.4.jar" >> $GITHUB_ENV
    
    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_INSTALL_PREFIX=$PWD/install \
          -DCMAKE_C_COMPILER=${{ matrix.cc }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
          -DCMAKE_CXX_STANDARD=17 \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DMatlab_ROOT_DIR=${MATLAB_ROOT} \
          -DAL_BACKEND_HDF5=ON \
          -DAL_BACKEND_MDSPLUS=${{ matrix.backend_mdsplus }} \
          -DAL_BACKEND_UDA=${{ matrix.backend_uda }} \
          -DAL_BUILD_MDSPLUS_MODELS=OFF \
          -DAL_DOWNLOAD_DEPENDENCIES=ON \
          -DAL_CORE_GIT_REPOSITORY=https://github.com/iterorganization/IMAS-Core.git \
          -DAL_PLUGINS_GIT_REPOSITORY=https://github.com/iterorganization/al-plugins.git \
          -DDD_GIT_REPOSITORY=https://github.com/iterorganization/IMAS-Data-Dictionary.git \
          -DAL_CORE_VERSION=main \
          -DAL_PLUGINS_VERSION=main \
          -DDD_VERSION=main \
          -DAL_EXAMPLES=ON \
          -DAL_TESTS=ON \
          -DAL_PLUGINS=ON \
          -DAL_HLI_DOCS=ON \
          -DBoost_NO_BOOST_CMAKE=ON
    
    - name: Build
      run: |
        make -C build -j$(nproc) all
    
    - name: Run tests
      run: |
        # Create test database
        mkdir -p testdb
        export USER="$PWD/testdb"
        # Ensure MATLAB libraries are in the path
        export LD_LIBRARY_PATH=${MATLAB_ROOT}/bin/glnxa64:${LD_LIBRARY_PATH}
        # Run tests with verbose output
        cd build
        ctest --output-on-failure --verbose
      continue-on-error: true
    
    - name: Install
      run: |
        make -C build install
    
    - name: List installed files
      run: |
        ls -lR install/
    
    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ matrix.os }}-${{ matrix.name }}
        path: |
          build/CMakeCache.txt
          build/CMakeFiles/CMakeError.log
          build/CMakeFiles/CMakeOutput.log
          build/Testing/
        retention-days: 7
    
    - name: Upload installation
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: installation-${{ matrix.os }}-${{ matrix.name }}
        path: install/
        retention-days: 7

  build-docs-only:
    name: Build Documentation Only
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          pkg-config \
          default-jdk \
          wget
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sphinx sphinx-rtd-theme myst-parser sphinx-design
    
    - name: Download Saxon-HE
      run: |
        mkdir -p $HOME/saxon
        cd $HOME/saxon
        wget -q https://github.com/Saxonica/Saxon-HE/releases/download/SaxonHE12-4/SaxonHE12-4J.zip
        unzip -q SaxonHE12-4J.zip
        echo "SAXON_JAR=$HOME/saxon/saxon-he-12.4.jar" >> $GITHUB_ENV
    
    - name: Configure CMake for docs only
      run: |
        cmake -B build \
          -DCMAKE_INSTALL_PREFIX=$PWD/install \
          -DAL_DOWNLOAD_DEPENDENCIES=ON \
          -DAL_CORE_GIT_REPOSITORY=https://github.com/iterorganization/IMAS-Core.git \
          -DAL_PLUGINS_GIT_REPOSITORY=https://github.com/iterorganization/al-plugins.git \
          -DDD_GIT_REPOSITORY=https://github.com/iterorganization/IMAS-Data-Dictionary.git \
          -DAL_CORE_VERSION=main \
          -DAL_PLUGINS_VERSION=main \
          -DDD_VERSION=main \
          -DAL_HLI_DOCS=ON \
          -DAL_DOCS_ONLY=ON
    
    - name: Build documentation
      run: |
        make -C build doc
      continue-on-error: true
    
    - name: Check for documentation warnings
      run: |
        if [ -f build/doc_warnings.log ]; then
          echo "Documentation warnings found:"
          cat build/doc_warnings.log
        fi
    
    - name: Upload documentation
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: |
          build/doc/_build/html/
        retention-days: 30
