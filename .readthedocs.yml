# Read the Docs configuration file for IMAS-Matlab
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

  jobs:
    post_checkout:
      # Clone IMAS-Core (only if not already present)
      - |
        if [ ! -d "$READTHEDOCS_BUILD/IMAS-Core" ]; then
          git clone --depth 1 --branch develop \
            https://github.com/iterorganization/IMAS-Core.git \
            "$READTHEDOCS_BUILD/IMAS-Core"
        fi

      # Create symlink from IMAS-Core/common/doc_common to doc/doc_common
      - mkdir -p "$READTHEDOCS_BUILD/doc"
      - ln -sfn "$READTHEDOCS_BUILD/IMAS-Core/common/doc_common" \
               "$READTHEDOCS_BUILD/doc/doc_common"
      - echo "Created symlink: doc/doc_common -> IMAS-Core/common/doc_common"

    post_install:
      # Make AL_COMMON_PATH available to the doc build
      - echo "AL_COMMON_PATH=$READTHEDOCS_BUILD/IMAS-Core/common" >> $READTHEDOCS_ENVIRONMENT
      - echo "AL_COMMON_PATH exported"

# Build documentation in the "doc" directory with Sphinx
sphinx:
  configuration: doc/conf.py
  fail_on_warning: false

# Optionally build your docs in additional formats such as PDF and ePub
formats:
  - pdf
  - epub

# Optional but recommended, declare the Python requirements required
# to build your documentation
python:
  install:
    - requirements: IMAS-Core/common/doc_common/requirements.txt

# Submodules configuration (optional)
submodules:
  include: all
  recursive: true
